<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f16">
  <title>XAI MASTER</title>
  <link rel="stylesheet" href="/miniapp/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-mark">X</div>
        <div><strong>XAI MASTER</strong><span id="statusText">ONLINE</span></div>
      </div>
      <button class="lang-btn" id="langBtn">EN</button>
    </header>

    <section class="profile glass">
      <div class="avatar" id="avatar">A</div>
      <div class="profile-copy">
        <h1 id="profileName">AHMAD</h1>
        <p id="profileUsername">Telegram profile</p>
        <small id="profileRole">User</small>
      </div>
    </section>

    <section class="stats-grid">
      <article class="stat glass"><span id="statGroupsLabel">Groups</span><b id="statGroups">0</b></article>
      <article class="stat glass"><span id="statMembersLabel">Members</span><b id="statMembers">—</b></article>
      <article class="stat glass"><span id="statBlockedLabel">Blocked</span><b id="statBlocked">—</b></article>
    </section>

    <section class="section-title"><span id="mainTitle">XAI MASTER</span><span id="mainSubtitle">Control Center</span></section>
    <nav class="menu-grid">
      <button class="menu-card glass" data-page="market"><span>•</span><b id="marketTitle">Market</b><small id="marketSub">Crypto, Gold, USD</small></button>
      <button class="menu-card glass" data-page="groups"><span>•</span><b id="groupsTitle">My Groups</b><small id="groupsSub">Manage your groups</small></button>
      <button class="menu-card glass" data-page="security"><span>•</span><b id="securityTitle">Security</b><small id="securitySub">Protection controls</small></button>
      <button class="menu-card glass" data-page="ai"><span>•</span><b id="aiTitle">AI Manager</b><small id="aiSub">Natural language control</small></button>
      <button class="menu-card glass" data-page="analytics"><span>•</span><b id="analyticsTitle">Analytics</b><small id="analyticsSub">Activity and moderation</small></button>
      <button class="menu-card glass" data-page="support"><span>•</span><b id="supportTitle">Support</b><small id="supportSub">Help and reports</small></button>
    </nav>

    <section class="view glass" id="view">
      <div class="view-head"><h2 id="viewTitle">Market</h2><button id="backBtn" class="back hidden">• Back</button></div>
      <div id="viewContent"></div>
    </section>

    <footer><span>XAI MASTER V3</span><span id="footerText">Smart Telegram Group Management</span></footer>
  </main>
  <script src="/miniapp/app.js"></script>
</body>
</html>
