<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <title>XAI MASTER</title>
  <link rel="stylesheet" href="/miniapp/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-lockup"><span class="brand-mark">X</span><div><strong>XAI MASTER</strong><small id="online">ONLINE</small></div></div>
      <button id="profileButton" class="profile-mini" aria-label="Profile"><span id="profileInitial">A</span><img id="profileImage" class="hidden" alt=""></button>
    </header>

    <section id="homePage" class="page active-page"></section>
    <section id="marketPage" class="page"></section>
    <section id="groupsPage" class="page"></section>
    <section id="chatPage" class="page"></section>
    <section id="profilePage" class="page"></section>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-item active"><span class="nav-icon home-icon"></span><small id="navHome">Home</small></button>
      <button data-route="market" class="nav-item"><span class="nav-icon market-icon"></span><small id="navMarket">Market</small></button>
      <button data-route="groups" class="nav-item"><span class="nav-icon groups-icon"></span><small id="navGroups">Groups</small></button>
    </nav>
  </main>
  <script src="/miniapp/app.js"></script>
</body>
</html>
