<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>XAI Code Agent</title>
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">XAI CODE AGENT</div>
        <h1 id="title">دستیار کدنویسی</h1>
      </div>
      <div id="status" class="status">در حال آماده‌سازی</div>
    </header>

    <section class="hero card">
      <h2 id="heroTitle">پروژه‌ات را به Agent بسپار</h2>
      <p id="heroText">مخزن GitHub را وصل کن، درخواست تغییر کد را بنویس و نتیجه را به شکل Branch و Pull Request دریافت کن.</p>
      <button id="connectBtn" class="primary">اتصال GitHub</button>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 id="repoTitle">مخزن‌ها</h2>
        <button id="refreshBtn" class="ghost">به‌روزرسانی</button>
      </div>
      <div id="repos" class="empty">برای نمایش مخزن‌ها ابتدا GitHub را وصل کنید.</div>
    </section>

    <section class="card">
      <h2 id="taskTitle">درخواست کدنویسی</h2>
      <label for="repoInput" id="repoLabel">Repository</label>
      <input id="repoInput" autocomplete="off" placeholder="owner/repository">
      <label for="requestInput" id="requestLabel">درخواست</label>
      <textarea id="requestInput" rows="5" placeholder="مثلاً: خطای ورود را پیدا و اصلاح کن"></textarea>
      <button id="taskBtn" class="primary">ارسال درخواست</button>
      <div id="taskResult" class="result" hidden></div>
    </section>

    <section class="card compact">
      <div class="section-head"><h2 id="accountTitle">حساب</h2><span id="plan">Free</span></div>
      <div class="account-row"><span id="creditsLabel">اعتبار</span><strong id="credits">—</strong></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 id="billingTitle">خرید Credits</h2>
        <span id="billingStatus" class="status">—</span>
      </div>
      <div id="plans" class="plans"></div>
    </section>

    <section class="card compact">
      <button id="languageBtn" class="ghost full">English / हिन्दी / فارسی</button>
    </section>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/dashboard/app.js" defer></script>
</body>
</html>
