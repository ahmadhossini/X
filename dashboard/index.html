<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>XAI MASTER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">X</div>
      <div class="brand-copy"><div class="brand-name">XAI MASTER</div><div class="brand-subtitle" id="page-subtitle">خانه</div></div>
      <div class="api-pill"><span class="status-dot"></span><span id="api-label">API آنلاین</span></div>
    </header>
    <main id="app" class="page-wrap">
      <section id="page-home" class="page active">
        <button id="profile-open" class="profile-hero app-card" type="button">
          <div class="profile-avatar-wrap"><img id="user-photo" class="avatar avatar-xl" alt="profile" hidden><div id="user-avatar-fallback" class="avatar avatar-xl avatar-fallback">X</div><span class="online-badge"></span></div>
          <div class="profile-copy"><span class="eyebrow" data-i18n="welcome_back">خوش آمدید</span><h1 id="user-name">در حال دریافت...</h1><p id="user-username">@...</p></div><span class="profile-chevron">‹</span>
        </button>
      </section>
      <section id="page-profile" class="page" hidden>
        <div class="profile-page-head"><div class="profile-big-wrap"><img id="profile-photo" class="avatar profile-big" alt="profile" hidden><div id="profile-avatar-fallback" class="avatar profile-big avatar-fallback">X</div></div><h1 id="profile-name">...</h1><p id="profile-username">@...</p></div>
        <div class="profile-list app-card"><div class="profile-row"><span data-i18n="profile_name">نام</span><strong id="profile-name-value">-</strong></div><div class="profile-row"><span data-i18n="profile_username">نام کاربری</span><strong id="profile-username-value">-</strong></div><div class="profile-row"><span>Telegram ID</span><strong id="profile-id">-</strong></div><div class="profile-row"><span data-i18n="language">زبان</span><strong id="profile-language">فارسی</strong></div></div>
        <button id="language-toggle" class="language-button" type="button">• فارسی / English</button>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="navigation">
      <button class="nav-item active" data-page="home" type="button"><span class="nav-symbol">⌂</span><span data-i18n="home">خانه</span></button>
      <button class="nav-item" data-page="profile" type="button"><span class="nav-symbol">○</span><span data-i18n="profile">پروفایل</span></button>
    </nav>
    <div id="error" class="toast error" hidden></div>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script><script src="app.js"></script>
</body>
</html>
