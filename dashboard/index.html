<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XAI MASTER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>XAI MASTER</h1>
      <p>پنل مدیریت گروه</p>
    </header>

    <section class="profile-card">
      <img id="user-photo" src="" alt="profile" hidden>
      <div>
        <span>کاربر</span>
        <strong id="user-name">در حال دریافت...</strong>
      </div>
      <div>
        <span>وضعیت API</span>
        <strong id="status">در حال بررسی...</strong>
      </div>
    </section>

    <section id="security" class="settings-panel">
      <div class="section-head">
        <h2>امنیت گروه</h2>
        <span id="group-status">در حال اتصال...</span>
      </div>
      <div id="settings-list" class="settings-list"></div>
    </section>

    <p id="error" class="error" hidden></p>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
