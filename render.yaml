services:
  - type: web
    name: xai-master
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SPONSOR_CHANNEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MARKET_CACHE_SECONDS
        value: "60"
