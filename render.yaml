services:
  - type: web
    name: xai-code-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CONNECT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MINIAPP_URL
        sync: false
      - key: CODE_AGENT_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TON_WALLET_ADDRESS
        sync: false
      - key: TON_PRO_PRICE_NANO_TON
        sync: false
      - key: TON_TEAM_PRICE_NANO_TON
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: TON_NETWORK
        value: mainnet
      - key: FREE_MONTHLY_CREDITS
        value: "5"
      - key: PRO_MONTHLY_CREDITS
        value: "500"
      - key: TEAM_MONTHLY_CREDITS
        value: "2000"
      - key: CODE_AGENT_WORKERS
        value: "4"
      - key: CODE_AGENT_QUEUE_SIZE
        value: "1000"

  - type: worker
    name: xai-code-agent-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: arq app.workers.arq_worker.WorkerSettings
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CODE_AGENT_WORKERS
        value: "4"
      - key: CODE_AGENT_QUEUE_SIZE
        value: "1000"
